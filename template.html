<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>PaperLint-Suite: Privacy-First Format Checker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.css" />
    <style>
        /* 简单的 Loading 动画样式 */
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: sans-serif; color: #666; text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">正在初始化隐私沙盒环境...<br>(首次加载约需 10-20秒)</div>
    <div id="root"></div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.js"></script>
    
    <script>
        const loadingDiv = document.getElementById("loading");

        // PDF.js Bridge: Expose PDF processing functions to Python
        window.pdfBridge = {
            // Store loaded PDF document and all extracted data
            currentPdf: null,
            pdfData: null,

            // Load PDF and extract ALL data at once (returns Promise)
            loadPdfComplete: async function(uint8Array) {
                try {
                    // Load PDF
                    const loadingTask = pdfjsLib.getDocument({data: uint8Array});
                    this.currentPdf = await loadingTask.promise;

                    const numPages = this.currentPdf.numPages;
                    const pages = [];

                    // Extract all data for all pages
                    for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                        const page = await this.currentPdf.getPage(pageNum);
                        const viewport = page.getViewport({scale: 1.0});

                        // Get text content
                        const textContent = await page.getTextContent();

                        // Group text items into blocks
                        const blocks = [];
                        let currentBlock = null;

                        for (const item of textContent.items) {
                            if (!item.str.trim()) continue;

                            const transform = item.transform;
                            const x = transform[4];
                            const y = viewport.height - transform[5];
                            const width = item.width;
                            const height = item.height;
                            const fontSize = Math.sqrt(transform[0] * transform[0] + transform[1] * transform[1]);

                            const textItem = {
                                text: item.str,
                                bbox: [x, y - height, x + width, y],
                                font: item.fontName,
                                size: fontSize
                            };

                            // Simple block grouping
                            if (!currentBlock || Math.abs(currentBlock.bbox[1] - textItem.bbox[1]) > 5) {
                                if (currentBlock) blocks.push(currentBlock);
                                currentBlock = {
                                    bbox: [...textItem.bbox],
                                    lines: [[textItem]]
                                };
                            } else {
                                currentBlock.bbox[0] = Math.min(currentBlock.bbox[0], textItem.bbox[0]);
                                currentBlock.bbox[1] = Math.min(currentBlock.bbox[1], textItem.bbox[1]);
                                currentBlock.bbox[2] = Math.max(currentBlock.bbox[2], textItem.bbox[2]);
                                currentBlock.bbox[3] = Math.max(currentBlock.bbox[3], textItem.bbox[3]);
                                currentBlock.lines[currentBlock.lines.length - 1].push(textItem);
                            }
                        }

                        if (currentBlock) blocks.push(currentBlock);

                        // Store page data
                        pages.push({
                            pageNum: pageNum,
                            width: viewport.width,
                            height: viewport.height,
                            blocks: blocks,
                            page: page  // Keep reference for pixel rendering
                        });
                    }

                    // Store all data
                    this.pdfData = {
                        success: true,
                        numPages: numPages,
                        pages: pages
                    };

                    return this.pdfData;

                } catch (error) {
                    this.pdfData = {
                        success: false,
                        error: error.message
                    };
                    return this.pdfData;
                }
            },

            // Get stored page data (synchronous access)
            getPageData: function(pageNum) {
                if (!this.pdfData || !this.pdfData.pages) {
                    throw new Error("PDF not loaded");
                }
                return this.pdfData.pages[pageNum - 1];
            },

            // Render page region to get pixel data (still async, but called on-demand)
            getPixelData: async function(pageNum, x, y, width, height) {
                const pageData = this.pdfData.pages[pageNum - 1];
                const page = pageData.page;
                const viewport = page.getViewport({scale: 1.0});

                // Create canvas
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = Math.ceil(width);
                canvas.height = Math.ceil(height);

                // Render the full page first
                const tempCanvas = document.createElement('canvas');
                const tempContext = tempCanvas.getContext('2d');
                tempCanvas.width = viewport.width;
                tempCanvas.height = viewport.height;

                await page.render({
                    canvasContext: tempContext,
                    viewport: viewport
                }).promise;

                // Extract the region
                const sourceX = Math.floor(x);
                const sourceY = Math.floor(y);
                const sourceWidth = Math.min(Math.ceil(width), viewport.width - sourceX);
                const sourceHeight = Math.min(Math.ceil(height), viewport.height - sourceY);

                context.drawImage(
                    tempCanvas,
                    sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, sourceWidth, sourceHeight
                );

                // Get grayscale pixel data
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = new Uint8Array(canvas.width * canvas.height);

                for (let i = 0; i < pixels.length; i++) {
                    const r = imageData.data[i * 4];
                    const g = imageData.data[i * 4 + 1];
                    const b = imageData.data[i * 4 + 2];
                    pixels[i] = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                }

                return {
                    width: canvas.width,
                    height: canvas.height,
                    pixels: Array.from(pixels)
                };
            }
        };

        // Store for pre-processed PDF data
        window.preprocessedPDFs = {};

        // Message handler for Worker communication
        // Listen for messages from the Stlite worker requesting PDF processing
        window.addEventListener('message', async (event) => {
            const data = event.data;

            // Handle PROCESS_PDF requests from worker
            if (data && data.type === 'PROCESS_PDF') {
                console.log('Received PROCESS_PDF request from worker:', data.requestId);

                try {
                    // Convert pdfData array back to Uint8Array
                    const uint8Array = new Uint8Array(data.pdfData);

                    // Process PDF using pdfBridge
                    const result = await window.pdfBridge.loadPdfComplete(uint8Array);

                    const response = {
                        type: 'PROCESS_PDF_RESPONSE',
                        requestId: data.requestId,
                        success: result.success,
                        data: result.success ? result : null,
                        error: result.success ? null : result.error
                    };

                    // Try multiple methods to send response back to worker
                    if (event.source && event.source.postMessage) {
                        event.source.postMessage(response, '*');
                        console.log('Sent response via event.source');
                    } else if (stliteWorker && stliteWorker.postMessage) {
                        stliteWorker.postMessage(response);
                        console.log('Sent response via stliteWorker');
                    } else if (event.ports && event.ports[0]) {
                        event.ports[0].postMessage(response);
                        console.log('Sent response via event.ports');
                    } else {
                        console.error('No method available to send response back to worker');
                    }

                    console.log('Sent PROCESS_PDF response:', data.requestId, result.success);
                } catch (error) {
                    console.error('Error processing PDF:', error);
                    const errorResponse = {
                        type: 'PROCESS_PDF_RESPONSE',
                        requestId: data.requestId,
                        success: false,
                        error: error.message
                    };

                    if (event.source && event.source.postMessage) {
                        event.source.postMessage(errorResponse, '*');
                    } else if (stliteWorker && stliteWorker.postMessage) {
                        stliteWorker.postMessage(errorResponse);
                    }
                }
            }

            // Handle GET_PIXEL_DATA requests from worker
            if (data && data.type === 'GET_PIXEL_DATA') {
                console.log('Received GET_PIXEL_DATA request from worker:', data.requestId);

                try {
                    // Get pixel data using pdfBridge
                    const pixelData = await window.pdfBridge.getPixelData(
                        data.pageNum,
                        data.x,
                        data.y,
                        data.width,
                        data.height
                    );

                    const response = {
                        type: 'GET_PIXEL_DATA_RESPONSE',
                        requestId: data.requestId,
                        success: true,
                        data: pixelData
                    };

                    if (event.source && event.source.postMessage) {
                        event.source.postMessage(response, '*');
                    } else if (stliteWorker && stliteWorker.postMessage) {
                        stliteWorker.postMessage(response);
                    }
                } catch (error) {
                    console.error('Error getting pixel data:', error);
                    const errorResponse = {
                        type: 'GET_PIXEL_DATA_RESPONSE',
                        requestId: data.requestId,
                        success: false,
                        error: error.message
                    };

                    if (event.source && event.source.postMessage) {
                        event.source.postMessage(errorResponse, '*');
                    } else if (stliteWorker && stliteWorker.postMessage) {
                        stliteWorker.postMessage(errorResponse);
                    }
                }
            }
        });

        // Intercept file uploads and preprocess PDFs
        function setupFileUploadInterceptor() {
            // Use MutationObserver to detect when Streamlit creates file upload inputs
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType === 1) { // Element node
                            // Find file input elements
                            const fileInputs = node.querySelectorAll ? node.querySelectorAll('input[type="file"]') : [];
                            fileInputs.forEach(attachPreprocessor);

                            // Also check if the node itself is a file input
                            if (node.tagName === 'INPUT' && node.type === 'file') {
                                attachPreprocessor(node);
                            }
                        }
                    });
                });
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

            // Also check existing file inputs
            document.querySelectorAll('input[type="file"]').forEach(attachPreprocessor);
        }

        function attachPreprocessor(fileInput) {
            // Avoid attaching multiple times
            if (fileInput.dataset.preprocessorAttached) return;
            fileInput.dataset.preprocessorAttached = 'true';

            fileInput.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                // Only process PDF files
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    console.log('Preprocessing PDF:', file.name);

                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);

                        // Process PDF using pdfBridge
                        const result = await window.pdfBridge.loadPdfComplete(uint8Array);

                        if (result.success) {
                            // Store the processed data with the filename as key
                            window.preprocessedPDFs[file.name] = result;
                            console.log('PDF preprocessed successfully:', file.name);
                        } else {
                            console.error('PDF preprocessing failed:', result.error);
                        }
                    } catch (error) {
                        console.error('Error preprocessing PDF:', error);
                    }
                }
            });
        }

        // Start intercepting after a short delay to ensure Stlite is ready
        setTimeout(setupFileUploadInterceptor, 1000);

        // Store reference to Stlite instance for worker communication
        let stliteWorker = null;

        stlite.mount({
            requirements: [],  // No Python dependencies needed - using PDF.js
            entrypoint: "main.py",
            files: {{FILES_JSON}},
        }, document.getElementById("root")).then((instance) => {
            console.log('Stlite mounted successfully');
            // Store worker reference if available
            if (instance && instance._worker) {
                stliteWorker = instance._worker;
                console.log('Stlite worker reference stored');
            }
        });

        // Hide loading message after a short delay
        setTimeout(() => {
            loadingDiv.style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
