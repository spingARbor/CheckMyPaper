<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperLint-Suite: Privacy-First Format Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #1976d2;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.active {
            display: block;
        }

        .success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .success h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .warning {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .warning h3 {
            color: #e65100;
            margin-bottom: 10px;
        }

        .error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .error h3 {
            color: #c62828;
            margin-bottom: 10px;
        }

        .violation {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }

        .violation:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .violation-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .violation-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .violation-title {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .violation-page {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9em;
        }

        .violation-details {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-top: 10px;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
        }

        .detail-value {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #eee;
        }

        #initStatus {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ PaperLint-Suite</h1>
            <p>隐私保护的论文格式在线检查工具</p>
        </div>

        <div class="content">
            <div id="initStatus">
                <div class="spinner"></div>
                <p>正在初始化隐私沙盒环境...<br>(首次加载约需 10-20秒)</p>
            </div>

            <div id="mainApp" style="display: none;">
                <div class="info-box">
                    <h3>🔒 隐私承诺 (Privacy First)</h3>
                    <p>此工具基于 <strong>WebAssembly</strong> 技术构建。您的论文文件<strong>完全在您的浏览器本地内存中处理</strong>，绝不会上传至任何服务器。</p>
                </div>

                <div class="form-group">
                    <label for="conferenceSelect">选择会议/期刊规范</label>
                    <select id="conferenceSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pdfUpload">上传论文 (仅限 PDF)</label>
                    <input type="file" id="pdfUpload" accept=".pdf">
                </div>

                <button id="checkBtn" class="btn" disabled>开始检查</button>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>正在本地分析文档结构 (这可能需要几秒钟)...</p>
                </div>

                <div id="results" class="results"></div>
            </div>
        </div>

        <div class="footer">
            Version: 2.0.0 (Pyodide) | Powered by WebAssembly
        </div>
    </div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <script>
        {{MAIN_SCRIPT}}
    </script>
</body>
</html>
