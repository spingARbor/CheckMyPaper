<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>PaperLint-Suite: Privacy-First Format Checker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.css" />
    <style>
        /* 简单的 Loading 动画样式 */
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: sans-serif; color: #666; text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">正在初始化隐私沙盒环境...<br>(首次加载约需 10-20秒)</div>
    <div id="root"></div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.js"></script>
    
    <script>
        const loadingDiv = document.getElementById("loading");

        // PDF.js Bridge: Expose PDF processing functions to Python
        window.pdfBridge = {
            // Store loaded PDF document and all extracted data
            currentPdf: null,
            pdfData: null,

            // Load PDF and extract ALL data at once (returns Promise)
            loadPdfComplete: async function(uint8Array) {
                try {
                    // Load PDF
                    const loadingTask = pdfjsLib.getDocument({data: uint8Array});
                    this.currentPdf = await loadingTask.promise;

                    const numPages = this.currentPdf.numPages;
                    const pages = [];

                    // Extract all data for all pages
                    for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                        const page = await this.currentPdf.getPage(pageNum);
                        const viewport = page.getViewport({scale: 1.0});

                        // Get text content
                        const textContent = await page.getTextContent();

                        // Group text items into blocks
                        const blocks = [];
                        let currentBlock = null;

                        for (const item of textContent.items) {
                            if (!item.str.trim()) continue;

                            const transform = item.transform;
                            const x = transform[4];
                            const y = viewport.height - transform[5];
                            const width = item.width;
                            const height = item.height;
                            const fontSize = Math.sqrt(transform[0] * transform[0] + transform[1] * transform[1]);

                            const textItem = {
                                text: item.str,
                                bbox: [x, y - height, x + width, y],
                                font: item.fontName,
                                size: fontSize
                            };

                            // Simple block grouping
                            if (!currentBlock || Math.abs(currentBlock.bbox[1] - textItem.bbox[1]) > 5) {
                                if (currentBlock) blocks.push(currentBlock);
                                currentBlock = {
                                    bbox: [...textItem.bbox],
                                    lines: [[textItem]]
                                };
                            } else {
                                currentBlock.bbox[0] = Math.min(currentBlock.bbox[0], textItem.bbox[0]);
                                currentBlock.bbox[1] = Math.min(currentBlock.bbox[1], textItem.bbox[1]);
                                currentBlock.bbox[2] = Math.max(currentBlock.bbox[2], textItem.bbox[2]);
                                currentBlock.bbox[3] = Math.max(currentBlock.bbox[3], textItem.bbox[3]);
                                currentBlock.lines[currentBlock.lines.length - 1].push(textItem);
                            }
                        }

                        if (currentBlock) blocks.push(currentBlock);

                        // Store page data
                        pages.push({
                            pageNum: pageNum,
                            width: viewport.width,
                            height: viewport.height,
                            blocks: blocks,
                            page: page  // Keep reference for pixel rendering
                        });
                    }

                    // Store all data
                    this.pdfData = {
                        success: true,
                        numPages: numPages,
                        pages: pages
                    };

                    return this.pdfData;

                } catch (error) {
                    this.pdfData = {
                        success: false,
                        error: error.message
                    };
                    return this.pdfData;
                }
            },

            // Get stored page data (synchronous access)
            getPageData: function(pageNum) {
                if (!this.pdfData || !this.pdfData.pages) {
                    throw new Error("PDF not loaded");
                }
                return this.pdfData.pages[pageNum - 1];
            },

            // Render page region to get pixel data (still async, but called on-demand)
            getPixelData: async function(pageNum, x, y, width, height) {
                const pageData = this.pdfData.pages[pageNum - 1];
                const page = pageData.page;
                const viewport = page.getViewport({scale: 1.0});

                // Create canvas
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = Math.ceil(width);
                canvas.height = Math.ceil(height);

                // Render the full page first
                const tempCanvas = document.createElement('canvas');
                const tempContext = tempCanvas.getContext('2d');
                tempCanvas.width = viewport.width;
                tempCanvas.height = viewport.height;

                await page.render({
                    canvasContext: tempContext,
                    viewport: viewport
                }).promise;

                // Extract the region
                const sourceX = Math.floor(x);
                const sourceY = Math.floor(y);
                const sourceWidth = Math.min(Math.ceil(width), viewport.width - sourceX);
                const sourceHeight = Math.min(Math.ceil(height), viewport.height - sourceY);

                context.drawImage(
                    tempCanvas,
                    sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, sourceWidth, sourceHeight
                );

                // Get grayscale pixel data
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = new Uint8Array(canvas.width * canvas.height);

                for (let i = 0; i < pixels.length; i++) {
                    const r = imageData.data[i * 4];
                    const g = imageData.data[i * 4 + 1];
                    const b = imageData.data[i * 4 + 2];
                    pixels[i] = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                }

                return {
                    width: canvas.width,
                    height: canvas.height,
                    pixels: Array.from(pixels)
                };
            }
        };

        // Message handler for iframe communication
        window.addEventListener('message', async function(event) {
            // Security: In production, check event.origin
            if (event.data.type === 'PDF_PROCESS_REQUEST') {
                try {
                    const pdfData = event.data.pdfData;
                    const uint8Array = new Uint8Array(pdfData);

                    // Process PDF using pdfBridge
                    const result = await window.pdfBridge.loadPdfComplete(uint8Array);

                    // Send result back to iframe
                    event.source.postMessage({
                        type: 'PDF_PROCESS_RESPONSE',
                        requestId: event.data.requestId,
                        success: true,
                        data: {
                            success: result.success,
                            numPages: result.numPages,
                            pages: Array.from(result.pages).map(page => ({
                                pageNum: page.pageNum,
                                width: page.width,
                                height: page.height,
                                blocks: Array.from(page.blocks).map(block => ({
                                    bbox: Array.from(block.bbox),
                                    lines: Array.from(block.lines).map(line =>
                                        Array.from(line).map(item => ({
                                            text: item.text,
                                            bbox: Array.from(item.bbox),
                                            font: item.font,
                                            size: item.size
                                        }))
                                    )
                                }))
                            }))
                        }
                    }, '*');
                } catch (error) {
                    event.source.postMessage({
                        type: 'PDF_PROCESS_RESPONSE',
                        requestId: event.data.requestId,
                        success: false,
                        error: error.message
                    }, '*');
                }
            } else if (event.data.type === 'PDF_RENDER_REQUEST') {
                try {
                    const { pageNum, x, y, width, height } = event.data;
                    const result = await window.pdfBridge.getPixelData(pageNum, x, y, width, height);

                    event.source.postMessage({
                        type: 'PDF_RENDER_RESPONSE',
                        requestId: event.data.requestId,
                        success: true,
                        data: {
                            width: result.width,
                            height: result.height,
                            pixels: Array.from(result.pixels)
                        }
                    }, '*');
                } catch (error) {
                    event.source.postMessage({
                        type: 'PDF_RENDER_RESPONSE',
                        requestId: event.data.requestId,
                        success: false,
                        error: error.message
                    }, '*');
                }
            }
        });

        stlite.mount({
            requirements: [],  // No Python dependencies needed - using PDF.js
            entrypoint: "main.py",
            files: {"main.py":"\nimport streamlit as st\nimport os\nimport importlib\nimport sys\nimport asyncio\n\n# 设置页面配置\nst.set_page_config(\n    page_title=\"PaperLint - Privacy First Checker\",\n    page_icon=\"🛡️\",\n    layout=\"centered\"\n)\n\n# 自定义 CSS 优化界面\nst.markdown(\"\"\"\n    <style>\n    .stAlert { padding: 0.5rem; }\n    .reportview-container { margin-top: -2em; }\n    div[data-testid=\"stExpander\"] div[role=\"button\"] p { font-size: 1rem; font-weight: 600; }\n    </style>\n\"\"\", unsafe_allow_html=True)\n\nst.title(\"🛡️ PaperLint-Suite\")\nst.markdown(\"### 隐私保护的论文格式在线检查工具\")\n\nst.info(\"\"\"\n**🔒 隐私承诺 (Privacy First)**\n此工具基于 **WebAssembly** 技术构建。\n您的论文文件**完全在您的浏览器本地内存中处理**，绝不会上传至任何服务器。\n\"\"\")\n\n# 1. 自动扫描 check_logic 目录下的会议脚本\n# 注意：在 Stlite 虚拟文件系统中，我们通过 os.listdir 动态获取\ntry:\n    available_scripts = [f.replace('.py', '') for f in os.listdir('check_logic') if f.endswith('.py') and not f.startswith('__')]\nexcept FileNotFoundError:\n    available_scripts = []\n    st.error(\"未找到检查脚本目录，请检查构建配置。\")\n\n# 2. 侧边栏配置\nwith st.sidebar:\n    st.header(\"⚙️ 配置\")\n    selected_conf = st.selectbox(\"选择会议/期刊规范\", available_scripts, index=0 if available_scripts else None)\n    st.markdown(\"---\")\n    st.caption(\"Version: 1.0.0 (Wasm)\")\n\n# 3. 主上传区\nuploaded_file = st.file_uploader(\"上传论文 (仅限 PDF)\", type=['pdf'])\n\nif uploaded_file and selected_conf:\n    st.divider()\n    \n    # 动态导入对应的检查模块\n    module_name = f\"check_logic.{selected_conf}\"\n    \n    try:\n        checker_module = importlib.import_module(module_name)\n        \n        if st.button(f\"开始检查 ({selected_conf})\", type=\"primary\"):\n            with st.spinner(\"正在本地分析文档结构 (这可能需要几秒钟)...\"):\n                # 调用核心检查函数 (使用 await 直接调用异步函数)\n                # 注意：文件指针在读取后需要重置，但 fitz.open(stream=...) 处理字节流，这里传递 file object\n                uploaded_file.seek(0)\n                try:\n                    results = checker_module.run_check(uploaded_file)\n                except Exception as e:\n                    import traceback\n                    results = {\n                        \"status\": \"error\",\n                        \"message\": f\"调用检查函数时出错: {type(e).__name__}: {str(e)}\",\n                        \"traceback\": traceback.format_exc()\n                    }\n\n            # --- 结果展示逻辑 ---\n            if results[\"status\"] == \"error\":\n                st.error(f\"分析过程中发生错误: {results.get('message')}\")\n                # 显示详细的 traceback\n                if \"traceback\" in results:\n                    with st.expander(\"查看详细错误信息\"):\n                        st.code(results[\"traceback\"])\n            else:\n                violations = results[\"violations\"]\n                \n                if not violations:\n                    st.balloons()\n                    st.success(\"🎉 完美！未检测到明显的格式违规。\")\n                else:\n                    st.warning(f\"⚠️ 检测到 {len(violations)} 个潜在问题\")\n                    \n                    # 按类型分组展示 (可选)\n                    for i, v in enumerate(violations, 1):\n                        # 根据违规类型选择图标\n                        icon = \"🔴\" if \"Margin\" in v['type'] else \"🟡\"\n                        \n                        label = f\"{icon} Page {v.get('page', '?')}: {v['type']}\"\n                        \n                        with st.expander(label):\n                            col1, col2 = st.columns([1, 3])\n                            with col1:\n                                st.caption(\"位置 / 区域\")\n                                st.code(str(v.get('bbox', 'N/A')))\n                            with col2:\n                                st.caption(\"相关文本片段\")\n                                st.info(v.get('text', 'N/A'))\n                                \n    except ModuleNotFoundError:\n        st.error(f\"无法加载脚本: {module_name}\")\n    except Exception as e:\n        st.error(f\"运行时错误: {str(e)}\")\n        import traceback\n        st.code(traceback.format_exc())\n\nelif not selected_conf:\n    st.warning(\"暂无可用检查脚本，请联系管理员添加。\")\n","check_logic/usenix_2026.py":"try:\n    # Try to use component-based wrapper (for Stlite/browser environment)\n    from check_logic import pdf_wrapper_component as fitz\nexcept ImportError:\n    try:\n        # Try to use PDF.js wrapper (for browser/Pyodide environment)\n        from check_logic import pdf_wrapper as fitz\n    except ImportError:\n        # Fallback to PyMuPDF (for local testing)\n        import pymupdf as fitz\n\nimport re\nfrom collections import defaultdict\n\n# ==========================================\n# 1. 核心常量定义 (来源于 USENIX 脚本)\n# ==========================================\nTOTAL_HEIGHT = 11 * 72         # \\paperheight\nTOTAL_WIDTH = int(8.5 * 72)    # \\paperwidth\nTEXT_WIDTH = 7 * 72            # \\textwidth\nTEXT_HEIGHT = 9 * 72           # \\textheight\nTOP_OFFSET = 72                # 1 inch\nMARGIN_WIDTH = (TOTAL_WIDTH - TEXT_WIDTH) / 2\nOFFSET_TITLE = int(3.5 * 72)   # Title area offset\n\n# 间距计算常量\nONE_EX = 4.5\nERROR_CORRECTION = 0.9\nREQ_SPACING_SECTION = (2.3 * ONE_EX) * ERROR_CORRECTION\nREQ_SPACING_SUBSECTION = (1.5 * ONE_EX) * ERROR_CORRECTION\nREQ_SPACING_SECTION_ABOVE = (3.3 * ONE_EX) * ERROR_CORRECTION\nREQ_SPACING_SUBSECTION_ABOVE = (3.05 * ONE_EX) * ERROR_CORRECTION\n\nCAPTION_LINES_ABOVE = 7\nCAPTION_LINES_BELOW = 0\n\nTOLERANCE = 5\nANNOTATION_TOLERANCE = 5\n\nALLOWED_AREA = (\n    MARGIN_WIDTH - ANNOTATION_TOLERANCE, \n    TOP_OFFSET - ANNOTATION_TOLERANCE, \n    TOTAL_WIDTH - MARGIN_WIDTH + ANNOTATION_TOLERANCE, \n    TOP_OFFSET + TEXT_HEIGHT + ANNOTATION_TOLERANCE\n)\n\n# ==========================================\n# 2. 辅助工具函数\n# ==========================================\n\ndef count_lines(page, rect, invert=False, stop=30):\n    \"\"\"通过像素分析计算空白行数 (核心黑科技)\"\"\"\n    try:\n        # 获取灰度位图\n        pix = page.get_pixmap(clip=rect, colorspace=fitz.csGRAY, alpha=False)\n        w, h, pixels = pix.width, pix.height, pix.samples\n\n        # 将字节流转换为行数据\n        lines = [pixels[offset:offset + w] for offset in range(0, w * h, w)]\n\n        if invert:\n            lines = lines[::-1]\n\n        white_lines = 0\n        for line in lines:\n            if white_lines > stop:\n                break\n            # 检查该行是否足够\"白\" (阈值200/255)\n            if sum([1 for i in range(w) if line[i] > 200]) >= w:\n                white_lines += 1\n            # else: break # 严格模式下遇到黑点即停，这里保持原逻辑松散检查\n\n        if len(lines) < stop and white_lines == len(lines):\n            return stop\n        return white_lines\n    except Exception:\n        return 0\n\ndef excess_area(allowed, bbox):\n    \"\"\"计算超出允许区域的面积\"\"\"\n    ax0, ay0, ax1, ay1 = allowed\n    bx0, by0, bx1, by1 = bbox\n\n    bbox_area = max(0, bx1 - bx0) * max(0, by1 - by0)\n\n    ox0 = max(ax0, bx0)\n    oy0 = max(ay0, by0)\n    ox1 = min(ax1, bx1)\n    oy1 = min(ay1, by1)\n\n    overlap_area = 0\n    if ox1 > ox0 and oy1 > oy0:\n        overlap_area = (ox1 - ox0) * (oy1 - oy0)\n\n    return bbox_area - overlap_area\n\n# ==========================================\n# 3. 具体检查逻辑函数\n# ==========================================\n\ndef find_margins(doc, start=1):\n    violations = []\n\n    for page in doc:\n        page_num = page.page_num\n        if page_num < start:\n            continue\n\n        # 1. 检查页面物理尺寸\n        if page_num == 1:\n            if abs(page.rect.width - TOTAL_WIDTH) > 1 or abs(page.rect.height - TOTAL_HEIGHT) > 1:\n                 violations.append({\n                    \"type\": f\"Invalid page size: {page.rect.width:.1f}x{page.rect.height:.1f} pt (Required: 8.5x11 inch)\",\n                    \"page\": page_num\n                })\n\n        text_dict = page.get_text(\"dict\")\n        \n        # 2. 扫描所有文本块\n        for block in text_dict[\"blocks\"]:\n            start_x, start_y, end_x, end_y = block[\"bbox\"]\n            if \"lines\" not in block: continue\n            \n            all_text = \" \".join(span[\"text\"] for line in block[\"lines\"] for span in line[\"spans\"])\n            \n            # 忽略页脚\n            if \"USENIX Association\" in all_text: continue\n            \n            # 忽略页码 (简单判断)\n            if all_text.strip().isdigit() and start_y > TOP_OFFSET + TEXT_HEIGHT: continue\n\n            # 3. 检查第一页 Title 区域是否混入 Abstract\n            if page_num == 1:\n                # 标题区域内的文本\n                if start_y < OFFSET_TITLE - TOLERANCE:\n                    if re.search(\"abstract($|\\\\s)\", all_text.lower()):\n                         violations.append({\n                            \"type\": \"Abstract appears inside Title/Author box\",\n                            \"page\": page_num,\n                            \"text\": all_text[:50]\n                        })\n\n            # 4. 检查是否超出版心 (Margins)\n            exceeding = excess_area(ALLOWED_AREA, block[\"bbox\"])\n            if exceeding > 1: # 容忍 1pt 的误差\n                violation_type = None\n                \n                # 判断具体是哪个方向超标\n                if start_x < MARGIN_WIDTH - TOLERANCE:\n                    # 再次确认是否只是行号\n                    violating_lines = [l for l in block[\"lines\"] if l[\"bbox\"][0] < MARGIN_WIDTH - TOLERANCE]\n                    line_texts = [s[\"text\"] for l in violating_lines for s in l[\"spans\"]]\n                    if not all(t.strip().isdigit() for t in line_texts):\n                        violation_type = \"Margin Violation (Left)\"\n                \n                elif end_x > TOTAL_WIDTH - MARGIN_WIDTH + TOLERANCE:\n                    violation_type = \"Margin Violation (Right)\"\n                elif start_y < TOP_OFFSET - TOLERANCE:\n                    violation_type = \"Margin Violation (Top)\"\n                elif int(end_y) > TOP_OFFSET + TEXT_HEIGHT + TOLERANCE:\n                    violation_type = \"Margin Violation (Bottom)\"\n\n                if violation_type:\n                    violations.append({\n                        \"type\": violation_type,\n                        \"page\": page_num,\n                        \"text\": all_text[:50],\n                        \"bbox\": block[\"bbox\"]\n                    })\n    return violations\n\ndef find_sections(doc, start=1):\n    violations = []\n\n    for page in doc:\n        page_num = page.page_num\n        if page_num < start or page_num == 1:\n            continue  # 跳过首页\n\n        text_dict = page.get_text(\"dict\")\n        for block in text_dict[\"blocks\"]:\n            if \"lines\" not in block: continue\n\n            # 筛选可能是标题的文本 (根据字号)\n            potential_section_items = []\n            for line in block[\"lines\"]:\n                for span in line[\"spans\"]:\n                    # USENIX 标题通常在 12pt 左右 (11.8 - 12.2)\n                    if 11.8 < span[\"size\"] < 12.2:\n                        potential_section_items.append(span)\n\n            if potential_section_items:\n                joined_text = \" \".join(span[\"text\"] for span in potential_section_items)\n\n                # 区分 Section 和 Subsection\n                req_below = 0\n                req_above = 0\n\n                if re.match(r\"\\d+ \", joined_text): # \"1 Introduction\"\n                    req_below = REQ_SPACING_SECTION\n                    req_above = REQ_SPACING_SECTION_ABOVE\n                elif re.match(r\"\\d+\\.\\d+\", joined_text): # \"2.1 Threat Model\"\n                    req_below = REQ_SPACING_SUBSECTION\n                    req_above = REQ_SPACING_SUBSECTION_ABOVE\n                else:\n                    continue # 不是标准标题\n\n                # 计算 BBox\n                all_bboxes = [d['bbox'] for d in potential_section_items]\n                x0 = min(b[0] for b in all_bboxes)\n                y0 = min(b[1] for b in all_bboxes)\n                x1 = max(b[2] for b in all_bboxes)\n                y1 = max(b[3] for b in all_bboxes)\n\n                # 检查下方间距\n                rect_below = fitz.Rect(x0, y1 + 1, x1, y1 + int(req_below))\n                lines_below = count_lines(page, rect_below, stop=int(req_below))\n\n                if lines_below < int(req_below):\n                    violations.append({\n                        \"type\": f\"Spacing BELOW section too small (Found {lines_below}px, Need {int(req_below)}px)\",\n                        \"page\": page_num,\n                        \"text\": joined_text[:50]\n                    })\n\n                # 检查上方间距\n                rect_above = fitz.Rect(x0, y0 - int(req_above), x1, y0 - 1)\n                lines_above = count_lines(page, rect_above, invert=True, stop=int(req_above))\n\n                if lines_above < int(req_above):\n                    violations.append({\n                        \"type\": f\"Spacing ABOVE section too small (Found {lines_above}px, Need {int(req_above)}px)\",\n                        \"page\": page_num,\n                        \"text\": joined_text[:50]\n                    })\n    return violations\n\ndef find_captions(doc, start=1):\n    violations = []\n\n    for page in doc:\n        page_num = page.page_num\n        if page_num < start or page_num == 1:\n            continue\n\n        text_dict = page.get_text(\"dict\")\n        for block in text_dict[\"blocks\"]:\n            if \"lines\" not in block: continue\n\n            caption_items = []\n            is_caption = False\n\n            # 简化的 Caption 提取逻辑\n            for line in block[\"lines\"]:\n                for span in line[\"spans\"]:\n                    text = span[\"text\"]\n                    # 检测 Figure/Table 关键字\n                    if re.match(r\"Fig[ure.]{1,3} \\d+:\", text) or re.match(r\"Tab[le.]{1,2} \\d+:\", text):\n                        is_caption = True\n                        caption_items.append(span)\n                    elif is_caption:\n                        # 简单的连续性检查：如果同一个 Block 里后续文本字号差不多，视为 Caption 一部分\n                        if caption_items and abs(span[\"size\"] - caption_items[-1][\"size\"]) < 1:\n                             caption_items.append(span)\n                        else:\n                            is_caption = False\n\n            if caption_items:\n                all_bboxes = [d['bbox'] for d in caption_items]\n                x0 = min(b[0] for b in all_bboxes)\n                y0 = min(b[1] for b in all_bboxes)\n                x1 = max(b[2] for b in all_bboxes)\n                y1 = max(b[3] for b in all_bboxes)\n\n                # 检查 Caption 上方间距 (通常用于 Table)\n                rect_above = fitz.Rect(x0, y0 - CAPTION_LINES_ABOVE, x1, y0 - 1)\n                lines_above = count_lines(page, rect_above, True, stop=10)\n\n                if lines_above < CAPTION_LINES_ABOVE:\n                     violations.append({\n                        \"type\": f\"Spacing ABOVE caption too small\",\n                        \"page\": page_num,\n                        \"text\": caption_items[0][\"text\"][:30] + \"...\"\n                    })\n\n                # 检查 Caption 下方间距\n                if CAPTION_LINES_BELOW > 0:\n                    rect_below = fitz.Rect(x0, y1 + 3, x1, y1 + CAPTION_LINES_BELOW - 2)\n                    lines_below = count_lines(page, rect_below, False, stop=10)\n                    if lines_below < CAPTION_LINES_BELOW:\n                         violations.append({\n                            \"type\": f\"Spacing BELOW caption too small\",\n                            \"page\": page_num,\n                            \"text\": caption_items[0][\"text\"][:30] + \"...\"\n                        })\n    return violations\n\ndef find_appendices(doc, start=1):\n    found = {\"Ethical\": False, \"Ethics\": False, \"Open\": False}\n    found_pages = {\"Ethical\": None, \"Ethics\": None, \"Open\": None}\n\n    for page in doc:\n        page_num = page.page_num\n        if page_num < start:\n            continue\n\n        text_dict = page.get_text(\"dict\")\n        for block in text_dict[\"blocks\"]:\n             texts = [span[\"text\"].lower() for line in block.get(\"lines\", []) for span in line[\"spans\"]]\n             full_text = \" \".join(texts)\n             \n             if \"ethical considerations\" in full_text:\n                 found[\"Ethical\"] = True\n                 found_pages[\"Ethical\"] = page_num\n             elif \"ethics considerations\" in full_text:\n                 found[\"Ethics\"] = True\n                 found_pages[\"Ethics\"] = page_num\n             elif \"open science\" in full_text:\n                 found[\"Open\"] = True\n                 found_pages[\"Open\"] = page_num\n\n    violations = []\n    # USENIX 2026 强制要求 Ethical Considerations 和 Open Science\n    if not found[\"Ethical\"]:\n        if found[\"Ethics\"]:\n            violations.append({\"type\": \"Wrong Section Title: Found 'Ethics Considerations', expected 'Ethical Considerations'\", \"page\": found_pages[\"Ethics\"]})\n        else:\n            violations.append({\"type\": \"Missing Section: 'Ethical Considerations' not found\", \"page\": None})\n            \n    if not found[\"Open\"]:\n        violations.append({\"type\": \"Missing Section: 'Open Science' not found\", \"page\": None})\n        \n    return violations\n\ndef font_stats(doc, start=1):\n    stats = defaultdict(int)\n    total_len = 0\n\n    for page in doc:\n        page_num = page.page_num\n        if page_num < start:\n            continue\n\n        for block in page.get_text(\"dict\")[\"blocks\"]:\n            if \"lines\" not in block: continue\n            for line in block[\"lines\"]:\n                for span in line.get(\"spans\", []):\n                    # 统计字数\n                    stats[span[\"font\"]] += len(span[\"text\"])\n                    total_len += len(span[\"text\"])\n\n    violations = []\n    if total_len > 0:\n        most_common = max(stats, key=stats.get)\n        # 允许的字体白名单 (USENIX 常见字体)\n        allowed_fonts = ['NimbusRomNo9L', 'TeXGyreTermes', 'STIXGeneral', 'Times', 'LiberationSerif']\n        \n        is_valid = any(allowed in most_common for allowed in allowed_fonts)\n        if not is_valid:\n             violations.append({\n                \"type\": f\"Main Font Warning: Detected '{most_common}'. USENIX usually requires Times/Nimbus/STIX.\",\n                \"page\": \"All\",\n                \"text\": \"Check your LaTeX compiler settings.\"\n            })\n            \n    return violations\n\n# ==========================================\n# 4. 主入口函数 (供 Stlite 调用)\n# ==========================================\n\ndef run_check(uploaded_file):\n    \"\"\"\n    接收 Streamlit UploadedFile 对象，返回检测结果字典\n    \"\"\"\n    try:\n        # 读取文件流\n        file_bytes = uploaded_file.read()\n\n        # 调试信息：文件大小\n        import sys\n        print(f\"DEBUG: File size: {len(file_bytes)} bytes\", file=sys.stderr)\n\n        doc = fitz.open(stream=file_bytes, filetype=\"pdf\")\n\n        print(f\"DEBUG: PDF loaded successfully, {doc.num_pages} pages\", file=sys.stderr)\n\n        all_violations = []\n\n        # 1. 页边距检查\n        all_violations.extend(find_margins(doc, start=1))\n\n        # 2. 章节间距检查\n        all_violations.extend(find_sections(doc, start=1))\n\n        # 3. 标题间距检查\n        all_violations.extend(find_captions(doc, start=1))\n\n        # 4. 附录完整性检查\n        all_violations.extend(find_appendices(doc, start=1))\n\n        # 5. 字体检查\n        all_violations.extend(font_stats(doc, start=1))\n\n        # 结果汇总\n        return {\n            \"status\": \"finished\",\n            \"violations\": all_violations\n        }\n\n    except Exception as e:\n        import traceback\n        # 返回详细的错误信息和完整的 traceback\n        return {\n            \"status\": \"error\",\n            \"message\": f\"An internal error occurred: {type(e).__name__}: {str(e)}\",\n            \"traceback\": traceback.format_exc()\n        }\n","check_logic/pdf_bridge_component.py":"\"\"\"\nStreamlit component for communicating with main thread's pdfBridge\n\"\"\"\nimport streamlit.components.v1 as components\nimport json\nimport uuid\n\n\ndef process_pdf_via_bridge(pdf_bytes):\n    \"\"\"\n    Process PDF using the main thread's pdfBridge via iframe communication\n\n    Args:\n        pdf_bytes: PDF file as bytes\n\n    Returns:\n        dict: PDF data structure compatible with PyMuPDF format\n    \"\"\"\n    # Convert bytes to list for JSON serialization\n    pdf_data_list = list(pdf_bytes)\n    request_id = str(uuid.uuid4())\n\n    # Create HTML component that communicates with parent window\n    component_html = f\"\"\"\n    <div id=\"status\">Processing PDF...</div>\n    <script>\n        (function() {{\n            const requestId = '{request_id}';\n            const pdfData = {json.dumps(pdf_data_list)};\n\n            // Send request to parent window\n            window.parent.postMessage({{\n                type: 'PDF_PROCESS_REQUEST',\n                requestId: requestId,\n                pdfData: pdfData\n            }}, '*');\n\n            // Listen for response\n            window.addEventListener('message', function(event) {{\n                if (event.data.type === 'PDF_PROCESS_RESPONSE' &&\n                    event.data.requestId === requestId) {{\n\n                    const statusDiv = document.getElementById('status');\n\n                    if (event.data.success) {{\n                        statusDiv.textContent = 'PDF processed successfully!';\n                        statusDiv.style.color = 'green';\n\n                        // Send result back to Streamlit\n                        window.parent.postMessage({{\n                            type: 'streamlit:setComponentValue',\n                            value: event.data.data\n                        }}, '*');\n                    }} else {{\n                        statusDiv.textContent = 'Error: ' + event.data.error;\n                        statusDiv.style.color = 'red';\n\n                        window.parent.postMessage({{\n                            type: 'streamlit:setComponentValue',\n                            value: {{ error: event.data.error }}\n                        }}, '*');\n                    }}\n                }}\n            }});\n        }})();\n    <\/script>\n    \"\"\"\n\n    # Use Streamlit component to render and get result\n    result = components.html(component_html, height=100)\n    return result\n\n\ndef render_pdf_region_via_bridge(page_num, x, y, width, height):\n    \"\"\"\n    Render a PDF region using the main thread's pdfBridge\n\n    Args:\n        page_num: Page number (1-indexed)\n        x, y, width, height: Region coordinates\n\n    Returns:\n        dict: Pixel data {width, height, pixels}\n    \"\"\"\n    request_id = str(uuid.uuid4())\n\n    component_html = f\"\"\"\n    <div id=\"status\">Rendering PDF region...</div>\n    <script>\n        (function() {{\n            const requestId = '{request_id}';\n\n            window.parent.postMessage({{\n                type: 'PDF_RENDER_REQUEST',\n                requestId: requestId,\n                pageNum: {page_num},\n                x: {x},\n                y: {y},\n                width: {width},\n                height: {height}\n            }}, '*');\n\n            window.addEventListener('message', function(event) {{\n                if (event.data.type === 'PDF_RENDER_RESPONSE' &&\n                    event.data.requestId === requestId) {{\n\n                    if (event.data.success) {{\n                        window.parent.postMessage({{\n                            type: 'streamlit:setComponentValue',\n                            value: event.data.data\n                        }}, '*');\n                    }} else {{\n                        window.parent.postMessage({{\n                            type: 'streamlit:setComponentValue',\n                            value: {{ error: event.data.error }}\n                        }}, '*');\n                    }}\n                }}\n            }});\n        }})();\n    <\/script>\n    \"\"\"\n\n    result = components.html(component_html, height=50)\n    return result\n","check_logic/pdf_wrapper_component.py":"\"\"\"\nSimplified PDF wrapper using Streamlit components for bridge communication\n\"\"\"\nfrom check_logic.pdf_bridge_component import process_pdf_via_bridge, render_pdf_region_via_bridge\n\n\nclass Rect:\n    \"\"\"Simple rectangle class\"\"\"\n    def __init__(self, x0, y0, x1, y1):\n        self.x0 = float(x0)\n        self.y0 = float(y0)\n        self.x1 = float(x1)\n        self.y1 = float(y1)\n\n    @property\n    def width(self):\n        return self.x1 - self.x0\n\n    @property\n    def height(self):\n        return self.y1 - self.y0\n\n\nclass Pixmap:\n    \"\"\"Pixmap class for pixel data\"\"\"\n    def __init__(self, width, height, pixels):\n        self.width = int(width)\n        self.height = int(height)\n        self.samples = bytes(pixels)\n\n\nclass Page:\n    \"\"\"Page wrapper\"\"\"\n    def __init__(self, doc, page_num, page_data):\n        self.doc = doc\n        self.page_num = page_num\n        self._page_data = page_data\n        self._rect = None\n\n    @property\n    def rect(self):\n        if self._rect is None:\n            w = float(self._page_data['width'])\n            h = float(self._page_data['height'])\n            self._rect = Rect(0, 0, w, h)\n        return self._rect\n\n    def get_text(self, mode=\"dict\"):\n        \"\"\"Extract text content from page\"\"\"\n        if mode != \"dict\":\n            raise NotImplementedError(f\"Mode '{mode}' not supported\")\n\n        blocks = []\n        for block_data in self._page_data['blocks']:\n            block = {\n                'bbox': tuple(block_data['bbox']),\n                'lines': []\n            }\n\n            for line_items in block_data['lines']:\n                line = {\n                    'bbox': self._calculate_line_bbox(line_items),\n                    'spans': []\n                }\n\n                for item in line_items:\n                    span = {\n                        'text': item['text'],\n                        'bbox': tuple(item['bbox']),\n                        'font': item['font'],\n                        'size': item['size']\n                    }\n                    line['spans'].append(span)\n\n                block['lines'].append(line)\n\n            blocks.append(block)\n\n        return {\n            'width': float(self._page_data['width']),\n            'height': float(self._page_data['height']),\n            'blocks': blocks\n        }\n\n    def _calculate_line_bbox(self, items):\n        \"\"\"Calculate bounding box for a line of text items\"\"\"\n        if len(items) == 0:\n            return (0.0, 0.0, 0.0, 0.0)\n\n        x0_vals = [item['bbox'][0] for item in items]\n        y0_vals = [item['bbox'][1] for item in items]\n        x1_vals = [item['bbox'][2] for item in items]\n        y1_vals = [item['bbox'][3] for item in items]\n\n        return (min(x0_vals), min(y0_vals), max(x1_vals), max(y1_vals))\n\n    def get_pixmap(self, clip=None, colorspace=None, alpha=False):\n        \"\"\"Get pixel data for a region\"\"\"\n        if clip is None:\n            clip = self.rect\n\n        # Use component to communicate with main thread\n        result = render_pdf_region_via_bridge(\n            self.page_num,\n            clip.x0, clip.y0,\n            clip.width, clip.height\n        )\n\n        if result and 'error' not in result:\n            return Pixmap(\n                result['width'],\n                result['height'],\n                result['pixels']\n            )\n        else:\n            raise Exception(f\"Failed to render PDF region: {result.get('error', 'Unknown error')}\")\n\n\nclass Document:\n    \"\"\"Document wrapper\"\"\"\n    def __init__(self, file_bytes, pdf_data):\n        self.file_bytes = file_bytes\n        self._pdf_data = pdf_data\n        self.num_pages = pdf_data['numPages']\n        self._pages = []\n\n        # Create page objects\n        for page_data in pdf_data['pages']:\n            self._pages.append(Page(self, page_data['pageNum'], page_data))\n\n    def __iter__(self):\n        return iter(self._pages)\n\n    def __len__(self):\n        return self.num_pages\n\n\ndef open(stream=None, filetype=None):\n    \"\"\"Open a PDF document from bytes using component bridge\"\"\"\n    if stream is None:\n        raise ValueError(\"stream parameter is required\")\n\n    # Use component to process PDF in main thread\n    pdf_data = process_pdf_via_bridge(stream)\n\n    if pdf_data and 'error' not in pdf_data:\n        if pdf_data['success']:\n            return Document(stream, pdf_data)\n        else:\n            raise Exception(f\"Failed to load PDF: {pdf_data.get('error', 'Unknown error')}\")\n    else:\n        raise Exception(\"Failed to communicate with PDF bridge\")\n\n\n# Colorspace constants (for compatibility)\ncsGRAY = \"gray\"\n","check_logic/pdf_wrapper.py":"\"\"\"\nPython wrapper for PDF.js bridge\nProvides a PyMuPDF-like API using PDF.js in the browser\n\"\"\"\nimport js\nfrom pyodide.ffi import to_js\n\n\nclass Rect:\n    \"\"\"Simple rectangle class compatible with PyMuPDF's Rect\"\"\"\n    def __init__(self, x0, y0, x1, y1):\n        self.x0 = float(x0)\n        self.y0 = float(y0)\n        self.x1 = float(x1)\n        self.y1 = float(y1)\n\n    @property\n    def width(self):\n        return self.x1 - self.x0\n\n    @property\n    def height(self):\n        return self.y1 - self.y0\n\n\nclass Pixmap:\n    \"\"\"Pixmap class for pixel data\"\"\"\n    def __init__(self, width, height, pixels):\n        self.width = int(width)\n        self.height = int(height)\n        self.samples = bytes(pixels)\n\n\nclass Page:\n    \"\"\"Page wrapper that uses PDF.js\"\"\"\n    def __init__(self, doc, page_num, page_data):\n        self.doc = doc\n        self.page_num = page_num\n        self._page_data = page_data\n        self._rect = None\n\n    @property\n    def rect(self):\n        if self._rect is None:\n            w = float(self._page_data['width'])\n            h = float(self._page_data['height'])\n            self._rect = Rect(0, 0, w, h)\n        return self._rect\n\n    def get_text(self, mode=\"dict\"):\n        \"\"\"Extract text content from page\"\"\"\n        if mode != \"dict\":\n            raise NotImplementedError(f\"Mode '{mode}' not supported\")\n\n        # Convert JavaScript data to Python format\n        blocks = []\n        js_blocks = self._page_data['blocks']\n\n        for i in range(len(js_blocks)):\n            block_data = js_blocks[i]\n            bbox_js = block_data['bbox']\n            block = {\n                'bbox': (float(bbox_js[0]), float(bbox_js[1]), float(bbox_js[2]), float(bbox_js[3])),\n                'lines': []\n            }\n\n            lines_js = block_data['lines']\n            for j in range(len(lines_js)):\n                line_items = lines_js[j]\n                line = {\n                    'bbox': self._calculate_line_bbox(line_items),\n                    'spans': []\n                }\n\n                for k in range(len(line_items)):\n                    item = line_items[k]\n                    bbox_js = item['bbox']\n                    span = {\n                        'text': str(item['text']),\n                        'bbox': (float(bbox_js[0]), float(bbox_js[1]), float(bbox_js[2]), float(bbox_js[3])),\n                        'font': str(item['font']),\n                        'size': float(item['size'])\n                    }\n                    line['spans'].append(span)\n\n                block['lines'].append(line)\n\n            blocks.append(block)\n\n        return {\n            'width': float(self._page_data['width']),\n            'height': float(self._page_data['height']),\n            'blocks': blocks\n        }\n\n    def _calculate_line_bbox(self, items):\n        \"\"\"Calculate bounding box for a line of text items\"\"\"\n        if len(items) == 0:\n            return (0.0, 0.0, 0.0, 0.0)\n\n        x0_vals = []\n        y0_vals = []\n        x1_vals = []\n        y1_vals = []\n\n        for i in range(len(items)):\n            bbox = items[i]['bbox']\n            x0_vals.append(float(bbox[0]))\n            y0_vals.append(float(bbox[1]))\n            x1_vals.append(float(bbox[2]))\n            y1_vals.append(float(bbox[3]))\n\n        return (min(x0_vals), min(y0_vals), max(x1_vals), max(y1_vals))\n\n    async def get_pixmap(self, clip=None, colorspace=None, alpha=False):\n        \"\"\"Get pixel data for a region\"\"\"\n        if clip is None:\n            clip = self.rect\n\n        # Access pdfBridge from window object\n        try:\n            pdfBridge = js.window.pdfBridge\n        except AttributeError:\n            pdfBridge = js.pdfBridge\n\n        # Call JavaScript bridge - it returns a Promise\n        promise = pdfBridge.getPixelData(\n            self.page_num,\n            clip.x0, clip.y0,\n            clip.width, clip.height\n        )\n\n        # Await the promise to get the resolved value\n        result = await promise\n\n        pixels_js = result.pixels\n        pixels_list = [int(pixels_js[i]) for i in range(len(pixels_js))]\n\n        return Pixmap(\n            result.width,\n            result.height,\n            pixels_list\n        )\n\n\nclass Document:\n    \"\"\"Document wrapper that uses PDF.js\"\"\"\n    def __init__(self, file_bytes):\n        self.file_bytes = file_bytes\n        self.num_pages = 0\n        self._pages = []\n        self._pdf_data = None\n\n    async def _load(self):\n        \"\"\"Load PDF using PDF.js bridge\"\"\"\n        try:\n            # Convert bytes to Uint8Array for JavaScript\n            uint8_array = to_js(self.file_bytes)\n\n            # Debug: Check what's available in js\n            import sys\n            print(f\"DEBUG: js object type: {type(js)}\", file=sys.stderr)\n            print(f\"DEBUG: js dir: {dir(js)[:20]}\", file=sys.stderr)  # First 20 attributes\n\n            # Try different ways to access pdfBridge\n            pdfBridge = None\n            error_messages = []\n\n            # Method 1: Direct access\n            try:\n                pdfBridge = js.pdfBridge\n                print(\"DEBUG: Found pdfBridge via js.pdfBridge\", file=sys.stderr)\n            except AttributeError as e:\n                error_messages.append(f\"js.pdfBridge failed: {e}\")\n\n            # Method 2: Via window\n            if pdfBridge is None:\n                try:\n                    pdfBridge = js.window.pdfBridge\n                    print(\"DEBUG: Found pdfBridge via js.window.pdfBridge\", file=sys.stderr)\n                except AttributeError as e:\n                    error_messages.append(f\"js.window.pdfBridge failed: {e}\")\n\n            # Method 3: Via globalThis\n            if pdfBridge is None:\n                try:\n                    pdfBridge = js.globalThis.pdfBridge\n                    print(\"DEBUG: Found pdfBridge via js.globalThis.pdfBridge\", file=sys.stderr)\n                except AttributeError as e:\n                    error_messages.append(f\"js.globalThis.pdfBridge failed: {e}\")\n\n            # Method 4: Via self (for workers)\n            if pdfBridge is None:\n                try:\n                    pdfBridge = js.self.pdfBridge\n                    print(\"DEBUG: Found pdfBridge via js.self.pdfBridge\", file=sys.stderr)\n                except AttributeError as e:\n                    error_messages.append(f\"js.self.pdfBridge failed: {e}\")\n\n            if pdfBridge is None:\n                error_msg = \"pdfBridge not found. Tried methods:\\n\" + \"\\n\".join(error_messages)\n                raise Exception(error_msg)\n\n            # Call the async JavaScript function - it returns a Promise\n            promise = pdfBridge.loadPdfComplete(uint8_array)\n\n            # Await the promise to get the resolved value\n            result = await promise\n\n            if not result.success:\n                raise Exception(f\"Failed to load PDF: {result.error}\")\n\n            self._pdf_data = result\n            self.num_pages = int(result.numPages)\n\n            # Create page objects\n            pages_js = result.pages\n            for i in range(len(pages_js)):\n                page_data = pages_js[i]\n                self._pages.append(Page(self, int(page_data.pageNum), page_data))\n        except Exception as e:\n            raise Exception(f\"Error in Document._load(): {type(e).__name__}: {str(e)}\")\n\n    def __iter__(self):\n        \"\"\"Iterate over pages\"\"\"\n        return iter(self._pages)\n\n    def __len__(self):\n        return self.num_pages\n\n\nasync def open(stream=None, filetype=None):\n    \"\"\"Open a PDF document from bytes\"\"\"\n    if stream is None:\n        raise ValueError(\"stream parameter is required\")\n    doc = Document(stream)\n    await doc._load()\n    return doc\n\n\n# Colorspace constants (for compatibility)\ncsGRAY = \"gray\"\n"},

            loadingDiv.style.display = 'none';
        }, 3000);
    </script>
