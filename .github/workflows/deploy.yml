name: Deploy PaperLint to Pages

on:
  push:
    branches: [ master ]  # 监听 master 分支的提交
  workflow_dispatch:    # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限来推送到 gh-pages 分支
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Build Script
        run: python build.py

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .             # 部署根目录 (包含生成的 index.html)
          branch: gh-pages      # 目标分支
          clean: true           # 部署前清理旧文件
